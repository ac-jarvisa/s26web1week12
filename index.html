<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARC Mockup Plan</title>
</head>
<body>
    <div class="container">
        <!-- AI prompt: "inside container, add a nav, header, main, and footer. Inside of each, add a div with the class "limit". Do not delete any comments." -->
        <nav>
            <div class="limit">
                <div class="logo">
                    <img src="images/logo.svg" alt="the logo for ARC, consisting of the upper case letters A, R, and C">
                </div>
                <!-- AI Prompt: "Inside the nav, after the div with the class logo, add a UL with three list items, inside each is a link: home, about, then contact, that each link to the current page using #" -->
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>                
            </div>
        </nav>

        <header>
            <div class="limit">
                
            </div>
        </header>

        <main>
            <div class="limit">
                <p>Main content goes here.</p>
            </div>
        </main>

        <footer>
            <div class="limit">
                <p>Footer content</p>
            </div>
        </footer>
    </div>
</body>
</html>
